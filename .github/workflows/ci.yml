name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mailflow_test
          POSTGRES_USER: mailflow_test
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailflow_test -d mailflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Plugin boundary
        working-directory: backend
        run: npm run lint:plugins

      - name: Syntax check
        working-directory: backend
        run: node --check src/index.js

      - name: Test
        working-directory: backend
        env:
          MAILFLOW_TEST_DATABASE_URL: postgresql://mailflow_test:ci_ephemeral_only@localhost:5432/mailflow_test
        run: npm test

      - name: Audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          VITE_DEFAULT_LANGUAGE: zhCN
          VITE_DEFAULT_THEME: light
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Team deployment configuration tests
        run: |
          node --test deploy/configure.test.mjs
          bash -n deploy/first-run.sh

      - name: Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
